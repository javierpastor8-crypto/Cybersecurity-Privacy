name: Swarm Node - Cybersecurity Privacy
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2,8,14,20 * * *'
permissions:
  contents: write
jobs:
  run-swarm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip && pip install groq requests
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          CLICKBANK_AFFILIATE_ID: ${{ secrets.CLICKBANK_AFFILIATE_ID }}
          DIGISTORE_AFFILIATE_ID: ${{ secrets.DIGISTORE_AFFILIATE_ID }}
          NICHO_NAME: "Cybersecurity_Privacy_Global"
        run: python matriz_v8_master.py
